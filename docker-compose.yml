services:
  api:
    build: .
    container_name: voyage_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./report:/app/report
      - ./mlflow.db:/app/mlflow.db

  dashboard:
    build: .
    container_name: voyage_dashboard
    command: streamlit run dashboard/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./report:/app/report
      - ./mlflow.db:/app/mlflow.db

  mlflow:
    build: .
    container_name: voyage_mlflow
    command: mlflow ui --backend-store-uri sqlite:///mlflow.db --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/app/mlruns
      - ./models:/app/models
      - ./report:/app/report